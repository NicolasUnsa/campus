<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.A.M.P.U.S | Acceso</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <script src="/js/auth.js" defer></script>
</head>
<body>
    <header class="encabezado">
        <div class="contenedor">
            <h1>C.A.M.P.U.S</h1>
            <p>Sistema de incio de sesion</p>
        </div>
    </header>
    <main class="contenedor pagina-acceso">
        <section class="tarjeta tarjeta-login">
            <h2>Iniciar sesión</h2>
            <p class="texto-secundario">
                Ingresa tus credenciales para continuar.
            </p>
            <form id="formLogin">
                <div class="campo">
                    <label for="usuario">Usuario o correo</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit" class="boton boton-principal">
                    Ingresar
                </button>
            </form>
            <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        </section>
    </main>
    <footer class="pie">
        <p>Introducción al Desarrollo Web · 2026</p>
    </footer>
</body>
</html>
