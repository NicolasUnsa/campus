<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <h1>C.A.M.P.U.S</h1>
        <p>Gestión de Estudiantes</p>
    </header>
    <main class="container">
        <!-- ========== FORMULARIO ========== -->
        <section class="card">
            <h2 id="formTitle">Registrar estudiante</h2>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="carrera">Carrera</label>
                    <input type="text" id="carrera" required>
                </div>
                <button type="submit" id="saveButton">
                    Registrar estudiante
                </button>
                <button type="button" id="cancelButton" class="secondary" style="display:none;">
                    Cancelar edición
                </button>
            </form>
            <div id="message"></div>
        </section>

        <!-- ========== TABLA ========== -->
        <section class="card">
            <div class="table-header">
                <h2>Lista de estudiantes</h2>
                <button type="button" id="refreshButton" class="secondary">
                    Actualizar
                </button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Carrera</th>
                            <th>Creado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/client.js"></script>

</body>
</html>
