<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudiantes | Gestión Académica</title>
<link rel="stylesheet" href="/css/estilos.css">
<script src="/js/estudiantes.js" defer></script>
</head>
<body>
<header class="encabezado">
<div class="contenedor">
<h1>Gestión de Estudiantes</h1>
<p>Administración de registros académicos</p>
</div>
</header>
<main class="contenedor">
<section class="tarjeta">
<div class="barra-superior">
<h2>Registro de estudiantes</h2>
<button id="btnCerrarSesion" class="boton boton-secundario">
Cerrar sesión
</button>
</div>
<form id="formEstudiante">
<input type="hidden" id="id">
<div class="campo">
<label for="nombre">Nombre completo</label>
<input id="nombre" maxlength="100" required>
</div>
<div class="campo">
<label for="email">Correo electrónico</label>
<input id="email" type="email" maxlength="100" required>
</div>
<div class="campo">
<label for="carrera">Carrera profesional</label>
<input id="carrera" maxlength="80" required>
</div>
<button type="submit" id="btnGuardar" class="boton boton-principal">
Registrar estudiante
</button>
<button type="button" id="btnCancelar" class="boton boton-secundario" hidden>
Cancelar edición
</button>
</form>
<p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
</section>
<section class="tarjeta">
<h2>Estudiantes registrados</h2>
<div class="tabla-contenedor">
<table>
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Correo</th>
<th>Carrera</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaEstudiantes">
<tr>
<td colspan="5">Cargando registros...</td>
</tr>
</tbody>
</table>
</div>
</section>
</main>
<footer class="pie">
<p>Introducción al Desarrollo Web · 2026</p>
</footer>
</body>
</html>
